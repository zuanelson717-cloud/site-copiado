<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relógio Digital - Múltiplos Fusos Horários</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .title {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .clock-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .timezone-name {
            font-size: 1.2rem;
            color: #fff;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .time-display {
            font-size: 2.5rem;
            color: #00ff88;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .date-display {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-bottom: 10px;
        }

        .offset-display {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
        }

        .controls {
            text-align: center;
            margin-top: 30px;
        }

        .timezone-select {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .timezone-select:hover {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.2);
        }

        .timezone-select option {
            background: #667eea;
            color: white;
        }

        .button {
            padding: 12px 25px;
            font-size: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button:hover {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .button:active {
            transform: scale(0.95);
        }

        .format-toggle {
            margin-top: 15px;
        }

        .format-toggle label {
            color: white;
            margin-right: 15px;
            cursor: pointer;
            font-size: 1rem;
        }

        .format-toggle input[type="radio"] {
            margin-right: 5px;
            cursor: pointer;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            margin-top: 30px;
        }

        .local-time {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }

            .time-display {
                font-size: 2rem;
            }

            .timezone-select {
                width: 100%;
                margin-right: 0;
                margin-bottom: 10px;
            }

            .button {
                width: 100%;
            }
        }

        @keyframes pulse {
            0%, 100% {
                text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            }
        }

        .time-display.pulse {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">⏰ Relógio Digital - Múltiplos Fusos Horários</h1>

        <div class="clocks-grid" id="clocksGrid"></div>

        <div class="controls">
            <div>
                <select id="timezoneSelect" class="timezone-select">
                    <option value="">Selecione um fuso horário para adicionar</option>
                </select>
                <button class="button" onclick="addTimezone()">Adicionar</button>
                <button class="button" onclick="resetClocks()">Resetar</button>
            </div>

            <div class="format-toggle">
                <label>
                    <input type="radio" name="format" value="24" checked> 24 horas
                </label>
                <label>
                    <input type="radio" name="format" value="12"> 12 horas
                </label>
            </div>
        </div>

        <div class="info-box">
            <div class="local-time">Hora Local: <strong id="localTime"></strong></div>
            <div>Total de Fusos Horários: <strong id="timezoneCount">0</strong></div>
        </div>
    </div>

    <script>
        // Lista completa de fusos horários
        const timezones = [
            { name: 'Sydney (AEDT)', value: 'Australia/Sydney' },
            { name: 'Tóquio (JST)', value: 'Asia/Tokyo' },
            { name: 'Hong Kong (HKT)', value: 'Asia/Hong_Kong' },
            { name: 'Singapura (SGT)', value: 'Asia/Singapore' },
            { name: 'Bangkok (ICT)', value: 'Asia/Bangkok' },
            { name: 'Dubai (GST)', value: 'Asia/Dubai' },
            { name: 'Mumbai (IST)', value: 'Asia/Kolkata' },
            { name: 'Moscou (MSK)', value: 'Europe/Moscow' },
            { name: 'Istambul (EET)', value: 'Europe/Istanbul' },
            { name: 'Cairo (EET)', value: 'Africa/Cairo' },
            { name: 'Londres (GMT/BST)', value: 'Europe/London' },
            { name: 'Lisboa (WET/WEST)', value: 'Europe/Lisbon' },
            { name: 'Paris (CET/CEST)', value: 'Europe/Paris' },
            { name: 'Berlim (CET/CEST)', value: 'Europe/Berlin' },
            { name: 'São Paulo (BRT/BRST)', value: 'America/Sao_Paulo' },
            { name: 'Nova York (EST/EDT)', value: 'America/New_York' },
            { name: 'Los Angeles (PST/PDT)', value: 'America/Los_Angeles' },
            { name: 'Cidade do México (CST/CDT)', value: 'America/Mexico_City' },
            { name: 'Denver (MST/MDT)', value: 'America/Denver' },
            { name: 'Chicago (CST/CDT)', value: 'America/Chicago' },
            { name: 'Vancouver (PST/PDT)', value: 'America/Vancouver' },
            { name: 'Toronto (EST/EDT)', value: 'America/Toronto' },
            { name: 'Anchorage (AKST/AKDT)', value: 'America/Anchorage' },
            { name: 'Honolulu (HST)', value: 'Pacific/Honolulu' },
        ];

        let activeTimezones = ['America/Sao_Paulo', 'Europe/London', 'Asia/Tokyo'];
        let format24 = true;

        // Inicializar
        function init() {
            populateTimezoneSelect();
            updateClocks();
            setInterval(updateClocks, 1000);

            // Listener para formato
            document.querySelectorAll('input[name="format"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    format24 = e.target.value === '24';
                });
            });
        }

        // Popular dropdown
        function populateTimezoneSelect() {
            const select = document.getElementById('timezoneSelect');
            timezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz.value;
                option.textContent = tz.name;
                select.appendChild(option);
            });
        }

        // Adicionar fuso horário
        function addTimezone() {
            const select = document.getElementById('timezoneSelect');
            const value = select.value;

            if (value && !activeTimezones.includes(value)) {
                activeTimezones.push(value);
                select.value = '';
                updateClocks();
            }
        }

        // Resetar para padrão
        function resetClocks() {
            activeTimezones = ['America/Sao_Paulo', 'Europe/London', 'Asia/Tokyo'];
            updateClocks();
        }

        // Atualizar relógios
        function updateClocks() {
            const grid = document.getElementById('clocksGrid');
            grid.innerHTML = '';

            activeTimezones.forEach(tz => {
                const tzData = timezones.find(t => t.value === tz);
                const card = createClockCard(tz, tzData.name);
                grid.appendChild(card);
            });

            // Atualizar hora local
            updateLocalTime();

            // Contar fusos horários
            document.getElementById('timezoneCount').textContent = activeTimezones.length;
        }

        // Criar card do relógio
        function createClockCard(timezone, name) {
            const card = document.createElement('div');
            card.className = 'clock-card';

            const now = new Date();
            const formatter = new Intl.DateTimeFormat('pt-BR', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: !format24
            });

            const dateFormatter = new Intl.DateTimeFormat('pt-BR', {
                timeZone: timezone,
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            const time = formatter.format(now);
            const date = dateFormatter.format(now);

            // Calcular offset
            const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
            const offset = (tzDate - utcDate) / (1000 * 60 * 60);
            const offsetStr = offset >= 0 ? `UTC+${offset}` : `UTC${offset}`;

            card.innerHTML = `
                <div class="timezone-name">${name}</div>
                <div class="time-display">${time}</div>
                <div class="date-display">${date}</div>
                <div class="offset-display">${offsetStr}</div>
                <button class="button" style="width: 100%; margin-top: 15px; font-size: 0.9rem;" onclick="removeTimezone('${timezone}')">Remover</button>
            `;

            return card;
        }

        // Remover fuso horário
        function removeTimezone(timezone) {
            activeTimezones = activeTimezones.filter(tz => tz !== timezone);
            updateClocks();
        }

        // Atualizar hora local
        function updateLocalTime() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('pt-BR', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: !format24
            });
            document.getElementById('localTime').textContent = formatter.format(now);
        }

        // Iniciar
        init();
    </script>
</body>
</html>
